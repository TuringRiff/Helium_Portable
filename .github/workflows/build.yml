name: build

on:
  workflow_dispatch:
    inputs:
      builder_ref:
        description: ChromiumPortable ref to build with. Empty uses the pinned commit.
        required: false
        default: ""
  # A full run downloads, repacks, injects and smoke-launches the browser, so
  # documentation-only commits are excluded rather than paying for a Windows runner.
  push:
    branches: [ main ]
    paths-ignore: [ "**.md", "LICENSE", ".gitignore", ".gitattributes" ]
  pull_request:
    branches: [ main ]
    paths-ignore: [ "**.md", "LICENSE", ".gitignore", ".gitattributes" ]
  schedule:
    - cron: "0 9 * * *"

# ChromiumPortable publishes no releases and scripts/release.py imports its internals
# (build_context, archive_name_regex, is_upgrade, ...), so tracking main would let an
# upstream refactor break the nightly run with nothing changing on this side. Bump
# deliberately, after checking that those imports still resolve.
env:
  BUILDER_REF: ce202ca2270304abb167b436f975e0ac768b4a37 # main as of 2026-08-13

jobs:
  # Version discovery is pure HTTP and needs no Windows, so the Windows runner
  # is only spun up when there is actually something to build.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      update_needed: ${{ steps.check.outputs.UPDATE_NEEDED }}
      env_json: ${{ steps.check.outputs.env_json }}
    steps:
      - name: Checkout Helium repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout portable builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Piracola/ChromiumPortable
          ref: ${{ github.event.inputs.builder_ref || env.BUILDER_REF }}
          path: _portable_builder

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Check for updates
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: _portable_builder
        run: python scripts/release.py --config browser.json --target helium_stable --workdir . check

      - name: Summarize
        shell: bash
        run: |
          {
            echo "| | |"
            echo "| --- | --- |"
            echo "| Upstream version | ${{ steps.check.outputs.UPSTREAM_VERSION }} |"
            echo "| Release tag | ${{ steps.check.outputs.RELEASE_TAG }} |"
            echo "| Build needed | ${{ steps.check.outputs.UPDATE_NEEDED }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: check
    if: github.event_name != 'schedule' || needs.check.outputs.update_needed == 'true'
    runs-on: windows-latest
    concurrency:
      group: helium-portable-build
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout Helium repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout portable builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Piracola/ChromiumPortable
          ref: ${{ github.event.inputs.builder_ref || env.BUILDER_REF }}
          path: _portable_builder

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests
          New-Item -ItemType Directory -Force -Path build/assets | Out-Null

      - name: Restore check results
        shell: pwsh
        env:
          CHECK_ENV: ${{ needs.check.outputs.env_json }}
        run: |
          if (-not $env:CHECK_ENV) { throw "The check job produced no environment payload." }
          foreach ($property in ($env:CHECK_ENV | ConvertFrom-Json).PSObject.Properties) {
            "$($property.Name)=$($property.Value)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "$($property.Name)=$($property.Value)"
          }

      - name: Set build date
        shell: pwsh
        run: |
          $date = Get-Date -Format 'yyyy-MM-dd'
          "BUILD_DATE=$date" >> $env:GITHUB_ENV

      - name: Build portable Helium
        env:
          HELIUM_EXTRACT_INNER: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: _portable_builder
        run: python -m portable_builder --config browser.json --target helium_stable --workdir . build

      - name: Archive build
        env:
          PYTHONPATH: _portable_builder
        run: python -m portable_builder --config browser.json --target helium_stable --workdir . archive

      - name: Verify archive
        env:
          PYTHONPATH: _portable_builder
        run: python -m portable_builder --config browser.json --target helium_stable --workdir . verify

      # A published release already carries this exact archive, so keep the artifact
      # only for the runs that will not publish one.
      - name: Upload artifact
        if: github.event_name == 'pull_request' || env.UPDATE_NEEDED != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Helium-Portable-Build
          path: build/assets/*.7z
          retention-days: 15

      - name: Publish release
        if: github.event_name != 'pull_request' && env.UPDATE_NEEDED == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: _portable_builder
        run: python scripts/release.py --config browser.json --target helium_stable --workdir . publish

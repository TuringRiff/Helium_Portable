name: build

on:
  workflow_dispatch:
    inputs:
      builder_ref:
        description: ChromiumPortable ref to use.
        required: false
        default: main
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 9 * * *"

jobs:
  # Version discovery is pure HTTP and needs no Windows, so the Windows runner
  # is only spun up when there is actually something to build.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      update_needed: ${{ steps.check.outputs.UPDATE_NEEDED }}
      env_json: ${{ steps.check.outputs.env_json }}
    steps:
      - name: Checkout Helium repository
        uses: actions/checkout@v4

      - name: Checkout portable builder
        uses: actions/checkout@v4
        with:
          repository: Piracola/ChromiumPortable
          ref: ${{ github.event.inputs.builder_ref || 'main' }}
          path: _portable_builder

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Check for updates
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: _portable_builder
        run: python -m portable_builder --config browser.json --target helium_stable --workdir . check

      - name: Summarize
        shell: bash
        run: |
          echo "UPDATE_NEEDED=${{ steps.check.outputs.UPDATE_NEEDED }}"
          echo "UPSTREAM_VERSION=${{ steps.check.outputs.UPSTREAM_VERSION }}"
          echo "CREATE_NEW_RELEASE=${{ steps.check.outputs.CREATE_NEW_RELEASE }}"
          echo "RELEASE_TAG=${{ steps.check.outputs.RELEASE_TAG }}"

  build:
    needs: check
    if: github.event_name != 'schedule' || needs.check.outputs.update_needed == 'true'
    runs-on: windows-latest
    concurrency:
      group: helium-portable-build
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout Helium repository
        uses: actions/checkout@v4

      - name: Checkout portable builder
        uses: actions/checkout@v4
        with:
          repository: Piracola/ChromiumPortable
          ref: ${{ github.event.inputs.builder_ref || 'main' }}
          path: _portable_builder

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests
          New-Item -ItemType Directory -Force -Path build/assets | Out-Null

      - name: Restore check results
        shell: pwsh
        env:
          CHECK_ENV: ${{ needs.check.outputs.env_json }}
        run: |
          if (-not $env:CHECK_ENV) { throw "The check job produced no environment payload." }
          foreach ($property in ($env:CHECK_ENV | ConvertFrom-Json).PSObject.Properties) {
            "$($property.Name)=$($property.Value)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "$($property.Name)=$($property.Value)"
          }

      - name: Set build date
        shell: pwsh
        run: |
          $date = Get-Date -Format 'yyyy-MM-dd'
          "BUILD_DATE=$date" >> $env:GITHUB_ENV

      - name: Build portable Helium
        env:
          HELIUM_EXTRACT_INNER: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: _portable_builder
        run: python -m portable_builder --config browser.json --target helium_stable --workdir . build

      - name: Archive build
        env:
          PYTHONPATH: _portable_builder
        run: python -m portable_builder --config browser.json --target helium_stable --workdir . archive

      - name: Verify archive
        env:
          PYTHONPATH: _portable_builder
        run: python -m portable_builder --config browser.json --target helium_stable --workdir . verify

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Helium-Portable-Build
          path: build/assets/*.7z
          retention-days: 15

      - name: Publish release
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push') && env.UPDATE_NEEDED == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish_release.py --config browser.json --target helium_stable
